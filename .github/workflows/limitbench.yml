# LimitBench: evaluates AI models on limits with proven answers.
# Trigger: commit benchmarks/limitbench/RUN.json ({"models": [...], "limit": null}) or run by hand.
# Needs the repository secret ANTHROPIC_API_KEY (Settings -> Secrets and variables -> Actions).
# Results are committed back to the branch under benchmarks/limitbench/results/.
name: limitbench
on:
  push:
    paths: ["benchmarks/limitbench/RUN.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . anthropic
      - name: Reference methods
        run: |
          rm -f benchmarks/limitbench/results/SUMMARY.md
          python benchmarks/limitbench/evaluate.py --method fmsl
          python benchmarks/limitbench/evaluate.py --method paths
      - name: Models
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "No ANTHROPIC_API_KEY secret: skipping model runs."; exit 0; fi
          LIMIT=$(python -c "import json;v=json.load(open('benchmarks/limitbench/RUN.json')).get('limit');print(v or '')")
          for m in $(python -c "import json;print(' '.join(json.load(open('benchmarks/limitbench/RUN.json'))['models']))"); do
            python benchmarks/limitbench/evaluate.py --method anthropic --model "$m" ${LIMIT:+--limit $LIMIT} --workers 4
          done
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/limitbench/results
          git commit -m "LimitBench results" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
