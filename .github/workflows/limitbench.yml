# LimitBench: evaluates AI models on limits with proven answers.
# Trigger: commit benchmarks/limitbench/RUN.json ({"models": [...], "limit": null, "set": "main" or "gaps", "tools": false}).
# Needs the repository secret ANTHROPIC_API_KEY (Settings -> Secrets and variables -> Actions).
# Results are committed back to the branch under benchmarks/limitbench/results/.
name: limitbench
on:
  push:
    paths: ["benchmarks/limitbench/RUN.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . anthropic
      - name: Reference methods
        run: |
          SET=$(python -c "import json;print(json.load(open('benchmarks/limitbench/RUN.json')).get('set','main'))")
          if [ "$SET" = gaps ]; then rm -f benchmarks/limitbench/results/SUMMARY_GAPS.md; else rm -f benchmarks/limitbench/results/SUMMARY.md; fi
          python benchmarks/limitbench/evaluate.py --set "$SET" --method fmsl
          python benchmarks/limitbench/evaluate.py --set "$SET" --method paths
      - name: Models
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p benchmarks/limitbench/results; : > benchmarks/limitbench/results/last_run.log
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "No ANTHROPIC_API_KEY secret: skipping model runs." | tee benchmarks/limitbench/results/last_run.log; exit 0; fi
          SET=$(python -c "import json;print(json.load(open('benchmarks/limitbench/RUN.json')).get('set','main'))")
          TOOLS=$(python -c "import json;print('--tools' if json.load(open('benchmarks/limitbench/RUN.json')).get('tools') else '')")
          LIMIT=$(python -c "import json;v=json.load(open('benchmarks/limitbench/RUN.json')).get('limit');print(v or '')")
          for m in $(python -c "import json;print(' '.join(json.load(open('benchmarks/limitbench/RUN.json'))['models']))"); do
            python benchmarks/limitbench/evaluate.py --set "$SET" --method anthropic --model "$m" $TOOLS ${LIMIT:+--limit $LIMIT} --workers 4 2>&1 | tee -a benchmarks/limitbench/results/last_run.log
            test "${PIPESTATUS[0]}" -eq 0 || exit 1
          done
      - name: Commit results (always, so the log of a failed run is kept)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/limitbench/results
          git commit -m "LimitBench results" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
