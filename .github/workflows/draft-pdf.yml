# Builds the JOSS paper (paper/paper.md) into a PDF to check that it compiles.
name: draft-pdf
on:
  push:
    paths: ["paper/**", ".github/workflows/draft-pdf.yml"]
  workflow_dispatch:
jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper draft
    steps:
      - uses: actions/checkout@v4
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/paper.pdf
