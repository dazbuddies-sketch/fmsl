# Automatic publishing.
# Whenever main is pushed with a version (pyproject.toml) that has no GitHub release yet:
#   1. build the package and run the full test suite on the built wheel,
#   2. create the GitHub release vX.Y.Z (notes = that version's section of CHANGELOG.md)
#      -> Zenodo sees the release and mints a DOI,
#   3. publish to PyPI with trusted publishing (no password or token stored anywhere).
# One-time setup on pypi.org: add a pending publisher with
#   owner: dazbuddies-sketch   repository: fmsl   workflow: release.yml   environment: pypi
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
  release:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - run: pip install "$(ls dist/*.whl)[matrix]" && python -m unittest discover tests
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          printf '\nBy MJ Celedon. Development was assisted by an AI system (Anthropic'"'"'s Claude); all results are verified by the tests and cross-checks in this repository.\n' >> notes.md
          gh release create "v$VERSION" dist/* --title "FMSL $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
  pypi:
    needs: [check, release]
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
