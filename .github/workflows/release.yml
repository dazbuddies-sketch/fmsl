# Publishes to PyPI when a GitHub release is published.
# Uses PyPI "trusted publishing": no password or token is stored anywhere.
# One-time setup on pypi.org: add a pending publisher with
#   owner: dazbuddies-sketch   repository: fmsl   workflow: release.yml   environment: pypi
name: release
on:
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - run: pip install dist/*.whl && python -m unittest discover tests
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
